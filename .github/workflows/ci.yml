name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Check source and build the npm package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build and pack once
        run: |
          npm run build
          mkdir -p "$RUNNER_TEMP/search-package"
          npm pack --silent --pack-destination "$RUNNER_TEMP/search-package"
      - name: Save the package for testing and publication
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: npm-package
          path: ${{ runner.temp }}/search-package/*.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  verify:
    name: ${{ matrix.os }} / Node 22
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: npm-package
          path: ${{ runner.temp }}/search-package
      - name: Install and exercise the shared package
        run: |
          version="$(node -p "require('./package.json').version")"
          npm install --global "$RUNNER_TEMP/search-package/astralyn-search-$version.tgz"
          search --help >/dev/null
          if [ "$(search --version)" != "$version" ]; then
            echo "Installed CLI reports the wrong version." >&2
            exit 1
          fi
